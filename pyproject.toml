[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "judgegauge"
version = "0.1.0"
description = "Fail-closed calibration gates for LLM-as-judge pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "JudgeGauge contributors" }]
keywords = ["llm", "evaluation", "reliability", "calibration", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DaBestCode/JudgeGauge"
Issues = "https://github.com/DaBestCode/JudgeGauge/issues"

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[project.scripts]
judgegauge = "judgegauge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
